name: couple_app
description: "Couple — chat, location sharing, and shared moments."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + routing
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  signalr_netcore: ^1.4.0

  # Local storage
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # Background location + map
  flutter_background_geolocation: ^4.16.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Auth + secure storage
  flutter_secure_storage: ^9.2.2

  # Couple invite UX
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2

  # Chat media
  image_picker: ^1.1.2
  record: ^5.2.0
  just_audio: ^0.9.42

  # Push
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
