name: couple_app
description: "Couple — chat, location sharing, and shared moments."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + routing
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  signalr_netcore: ^1.4.0

  # Local storage
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # Auth + secure storage
  flutter_secure_storage: ^9.2.2

  # Couple invite UX
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2

  # Tasarım — Fraunces + Inter + Caveat (Google Fonts)
  google_fonts: ^6.2.1

  # Chat media
  image_picker: ^1.1.2

  # Phase 3+ ile geri eklenecek paketler (build engelleri yüzünden Phase 2'de geçici çıkarıldı):
  #   flutter_background_geolocation (özel Maven repo: maven.transistorsoft.com)
  #   flutter_map + latlong2 (haritalama, Phase 4)
  #   record + just_audio (ses notu, Phase 4)
  #   firebase_core + firebase_messaging (push, Phase 3 sonu)

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
